name: Verify and publish guest publishing image

on:
  push:
    tags: ["guest-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p lk-jwt-service --all-targets -- -D warnings
      - run: cargo test --locked -p lk-jwt-service
      - run: cargo test --locked -p lk-jwt-service-integration-tests -- --test-threads=1
      - run: cargo xtask e2e -- --locked --test standalone_membership

  docker:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    with:
      docker_tags: |
        type=match,pattern=guest-v(.*),group=1
        type=sha,format=long
